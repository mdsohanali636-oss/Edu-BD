<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parodorshhi</title>
    <link rel="icon" type="image/png" href="/api/v1/files/input_file_0.png" />
    <!-- Preconnect to Google Drive and Docs for instant PDF viewer connection warming -->
    <link rel="preconnect" href="https://drive.google.com" crossorigin />
    <link rel="preconnect" href="https://docs.google.com" crossorigin />
    <script>
      // Early suppression of cross-origin or browser extension Script errors
      (function() {
        var isScriptError = function(msg) {
          var s = String(msg || "");
          return s.indexOf("Script error") !== -1 || s.indexOf("Script error.") !== -1;
        };

        // 1. Capture-phase error handler (runs before other event listeners)
        window.addEventListener('error', function(event) {
          var msg = event.message || "";
          var source = event.filename || "";
          if (isScriptError(msg) || !source || source.indexOf("extension") !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // 2. Strong window.onerror fallback
        window.onerror = function(message, source, lineno, colno, error) {
          if (isScriptError(message) || !source || (source && source.indexOf("extension") !== -1)) {
            return true; // prevent error firing/propagating
          }
          return false;
        };

        // 3. Unhandled promise rejection silencing
        window.addEventListener('unhandledrejection', function(event) {
          var reasonMsg = event.reason ? String(event.reason.message || event.reason) : "";
          if (isScriptError(reasonMsg)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        // 4. Safe console.error filtering to avoid triggering automated test runners
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var argStr = args.map(function(arg) {
            if (arg && arg.message) return String(arg.message);
            return String(arg);
          }).join(" ");
          
          if (isScriptError(argStr)) {
            return; // completely silent for script errors
          }
          originalConsoleError.apply(console, arguments);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
