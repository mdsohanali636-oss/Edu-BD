<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 260" width="100%" height="100%">
  <defs>
    <!-- Dynamic font styling with secure backup -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@700&amp;display=swap');
      .logo-text {
        font-family: 'Noto Serif Bengali', 'Tiro Bangla', serif, sans-serif;
        font-size: 130px;
        font-weight: 700;
        letter-spacing: -2px;
      }
    </style>

    <!-- Multi-stop high-contrast silver chrome gradient like the original logo -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="10%" stop-color="#F5F5F7" />
      <stop offset="25%" stop-color="#D0D0D5" />
      <stop offset="42%" stop-color="#9E9EAF" />
      <stop offset="48%" stop-color="#606070" />
      <stop offset="52%" stop-color="#E8E8F0" />
      <stop offset="70%" stop-color="#C0C0D0" />
      <stop offset="88%" stop-color="#A2A2B2" />
      <stop offset="100%" stop-color="#707080" />
    </linearGradient>

    <!-- Side/extrusion gradient for realistic 3D shadow depth -->
    <linearGradient id="3d-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2A30" />
      <stop offset="50%" stop-color="#4F4F5A" />
      <stop offset="100%" stop-color="#121218" />
    </linearGradient>

    <!-- Premium detailed damask/floral engraving texture pattern -->
    <pattern id="engraving-pattern" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(25 0 0)">
      <!-- Fine vector engraving wave-lines pattern -->
      <path d="M0,8 C8,4 24,12 32,8 M0,24 C8,20 24,28 32,24" stroke="#4A4A5A" stroke-width="0.75" opacity="0.45" fill="none" />
      <!-- Subtle internal textured rings and delicate paisley points -->
      <circle cx="8" cy="16" r="2.5" stroke="#777788" stroke-width="0.4" fill="none" opacity="0.35" />
      <circle cx="24" cy="16" r="2.5" stroke="#777788" stroke-width="0.4" fill="none" opacity="0.35" />
      <path d="M4,16 Q8,12 12,16 T20,16" stroke="#9999AA" stroke-width="0.3" fill="none" opacity="0.3" />
      <!-- Additional diagonal hatchings -->
      <line x1="0" y1="0" x2="32" y2="32" stroke="#888899" stroke-width="0.3" opacity="0.25" />
    </pattern>

    <!-- Premium shadow filter for standard depth -->
    <filter id="shadow-filter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="8" stdDeviation="5.5" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Mask ClipPath to bound the engraving pattern exactly within text -->
    <clipPath id="text-clip">
      <text x="375" y="145" text-anchor="middle" dominant-baseline="middle" class="logo-text">পারদর্শী</text>
    </clipPath>
  </defs>

  <g filter="url(#shadow-filter)">
    <!-- 1. Thick dark outline/stroke underlying entire shape for bold luxury contrast -->
    <text x="375" y="145" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="none" stroke="#15151A" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">পারদর্শী</text>

    <!-- 2. Re-layered 3D progressive extrusions (isometric down-right offset) -->
    <text x="381.0" y="152.5" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>
    <text x="380.0" y="151.2" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>
    <text x="379.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>
    <text x="378.0" y="148.8" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>
    <text x="377.0" y="147.5" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>
    <text x="376.0" y="146.2" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#3d-grad)">পারদর্শী</text>

    <!-- 3. Dark inner bevel shadow layer -->
    <text x="375" y="145.8" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="#25252A">পারদর্শী</text>

    <!-- 4. Main Chrome metallic face layer -->
    <text x="375" y="145" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="url(#chrome-grad)">পারদর্শী</text>

    <!-- 5. Overlay detailed engraving line pattern inside letter bounds -->
    <rect x="0" y="0" width="750" height="260" fill="url(#engraving-pattern)" clip-path="url(#text-clip)" style="mix-blend-mode: overlay;" />

    <!-- 6. Sharp white inner glow stroke highlights to catch light -->
    <text x="375" y="145" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="none" stroke="#FFFFFF" stroke-dasharray="100 20" stroke-width="1.5" stroke-linejoin="round" opacity="0.85">পারদর্শী</text>

    <!-- 7. Outer micro-bevel border lining -->
    <text x="375" y="145" text-anchor="middle" dominant-baseline="middle" class="logo-text" fill="none" stroke="#4A4A5A" stroke-width="0.8" stroke-linejoin="round" opacity="0.75">পারদর্শী</text>
  </g>
</svg>
